name: Pages Workflow
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: ci
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.pages-deploy.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Inject
        env:
          A4BCEC: ${{ secrets.A4BCEC }}
          B0B2C5: ${{ secrets.B0B2C5 }}
        run: |
          python3 -c "
          import pathlib, sys, os
          env_a = os.environ.get('A4BCEC', '')
          env_b = os.environ.get('B0B2C5', '')
          doc = pathlib.Path('index.html')
          body = doc.read_text(encoding='utf-8')
          result = body
          if env_a:
              result = result.replace('<!-- 6fd8df782c30a2c3 -->', env_a)
          if env_b:
              result = result.replace('<!-- 1da6a296d206078f6ea7cd97e7472afd0f -->', env_b)
          if result == body and (env_a or env_b):
              sys.exit(1)
          if result != body:
              doc.write_text(result, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: pages-deploy
        uses: actions/deploy-pages@v4
